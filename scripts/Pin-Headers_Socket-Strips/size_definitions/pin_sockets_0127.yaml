# SMD Straight(Vertical) logic:
SMD-1row_Straight_Right:
  inherit: defaults_PS_SMD_1Row_Vertical
  pin1_left: False
  row_count: 1
  pos_range:
    range: [2, 40]
  body:
    width:  1.27
    height: 0
    offset: 0.0
    overlength: 0
  pins:
    width:  0.4
    drill:  0
    offset: 0.0
    smd_length: 1.92
    #thick:  0.15
  pads:
    length: 2.1
    width:  0.75
    offset: 1.95
  datasheet: https://gct.co/files/drawings/bc075.pdf

SMD-1row_Straight_Left:
  inherit: SMD-1row_Straight_Right
  pin1_left: True

SMD-2row_Straight_Right:
  inherit: defaults_PS_SMD_2Row_Vertical
  pin1_left: False
  row_count: 2
  pos_range:
    range: [1, 40]
  body:
    width:  2.54
    height: 4.6
    offset: 0.0
    overlength: 0.0
  pins:
    width:  0.4
    drill:  0
    offset: 0.0
    smd_length: 1.92
    #thick:  0.15
  pads:
    length: 2.1
    width:  0.75
    offset: 1.95
  datasheet: from Kicad 4.0.7!
