# SMD Straight(Vertical) logic:
SMD-1row_Straight_Right:
  inherit: defaults_PS_SMD_1Row_Vertical
  pin1_left: False
  row_count: 1
  pos_range:
    range: [2, 40]
  body:
    width:  1.27
    height: 0
    offset: 0.0
    overlength: 0.75
  pins:
    width:  0.3
    drill:  0
    offset: 0.0
    smd_length: 1.95
    #thick: 0.1
  pads:
    length: 1.95
    width:  0.5
    offset: 1.2
  datasheet: https://gct.co/files/drawings/bc070.pdf

SMD-1row_Straight_Left:
  inherit: SMD-1row_Straight_Right
  pin1_left: True

SMD-2row_Straight_Right:
  inherit: defaults_PS_SMD_2Row_Vertical
  pin1_left: False
  row_count: 2
  pos_range:
    range: [2, 40]
  body:
    width:  2.54
    height: 0
    offset: 0.0
    overlength: 0.75
  pins:
    width:  0.3
    drill:  0
    offset: 0.0
    smd_length: 1.95
    # thick: 0.1
  pads:
    length: 1.95
    width:  0.5
    offset: 1.2
  datasheet: https://gct.co/files/drawings/bc085.pdf
