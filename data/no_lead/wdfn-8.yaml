  body_size_x: 2.9 .. 3.0 .. 3.1
  body_size_y: 1.9 .. 2.0 .. 2.1
  num_pins_x: 0
  num_pins_y: 4
  pitch: 0.5
  lead_width: 0.2 .. 0.25 .. 0.3
  lead_len: 0.3 .. 0.5
  EP_size_x: 1.050 .. 1.450
  EP_size_y: 1.050 .. 1.650
