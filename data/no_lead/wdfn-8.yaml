FileHeader:
  library: Package_DFN_QFN

WDFN-8-1EP_6x5mm_P1.27mm_EP3.4x4mm:
  size_source: 'http://ww1.microchip.com/downloads/en/DeviceDoc/8L_WDFN_5x6mm_MF_C04210B.pdf'
  device_type: 'WDFN'
  ipc_class: 'qfn'
  body_size_x:
    nominal: 6.0
    tolerance: 0
  body_size_y:
    nominal: 5.0
    tolerance: 0
  num_pins_x: 0
  num_pins_y: 4
  pitch: 1.27
  lead_width_min: 0.35
  lead_width_max: 0.48
  lead_len_min: 0.50
  lead_len_max: 0.70
  EP_size_x: 3.4
  EP_size_y: 4
  EP_num_paste_pads: [2, 2]

W-PDFN-8-1EP_6x5mm_P1.27mm_EP3x3mm:
  size_source: 'https://www.mouser.com/datasheet/2/671/mt25q_qljs_u_256_aba_0-3178731.pdf#page=22'
  device_type: 'W-PDFN'
  ipc_class: 'qfn'
  body_size_x:
    nominal: 6.0
    tolerance: 0.1
  body_size_y:
    nominal: 5.0
    tolerance: 0.1
  num_pins_x: 0
  num_pins_y: 4
  pitch: 1.27
  lead_width_min: 0.35
  lead_width_max: 0.45
  lead_len_min: 0.55
  lead_len_max: 0.65
  EP_size_x: 3
  EP_size_y: 3
  EP_num_paste_pads: [2, 2]
  body_pcb_gap:
    minimum: 0.0
  overall_height: 0.75 +/- 0.05
  lead_shape: rounded
  EP_chamfer: 0.5

WDFN-8-1EP_8x6mm_P1.27mm_EP6x4.8mm_ThermalVias:
  size_source: 'https://ww1.microchip.com/downloads/en/DeviceDoc/8L_WDFN_6x8mm_MN_C04172A.pdf'
  compatible_mpns:
    - Microchip-8L-WDFN-6x8mm-MN-C04172A
  device_type: 'WDFN'
  ipc_class: 'qfn'
  body_size_x: 8.0
  body_size_y: 6.0
  overall_height: 0.7 .. 0.75 .. 0.8
  num_pins_x: 0
  num_pins_y: 4
  pitch: 1.27
  lead_width: 0.35 .. 0.40 ..0.45
  lead_len: 0.45 .. 0.50 .. 0.55
  EP_size_x: 6
  EP_size_y: 4.8
  EP_num_paste_pads: [4, 3]
  thermal_vias:
    count: [5, 4]  # Thermal vias based on datasheet (see size_source above)
    drill: 0.33
    EP_num_paste_pads: [4, 3]
    paste_via_clearance: 0.1  # paste so it fits the thermal vias with avoidance
    paste_avoid_via: True

WFDFPN-8-1EP_3x2mm_P0.5mm_EP1.2x1.3mm:
